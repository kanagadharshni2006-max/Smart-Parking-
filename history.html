<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History | SmartPark</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-parking text-gradient me-2"></i>SmartPark
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="slots.html">Find Slots</a></li>
                    <li class="nav-item"><a class="nav-link" href="find_car.html">Find My Car</a></li>
                    <li class="nav-item"><a class="nav-link active" href="history.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="api/auth.php?action=logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <h2 class="mb-5">My Booking <span class="text-gradient">History</span></h2>
        
        <div class="glass p-5">
            <div class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Slot</th>
                            <th>Vehicle</th>
                            <th>Arrival</th>
                            <th>Duration</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>

    <!-- Ticket Modal -->
    <div class="modal fade" id="ticketModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass">
                <div class="modal-header">
                    <h5 class="modal-title">Booking Ticket</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <p class="text-muted small mb-3">Scan this code at the parking entrance</p>
                    <div id="qrcode" class="ticket-qr"></div>
                    <div class="mt-4 text-start">
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="small text-muted d-block">Reference ID</label>
                                <span class="fw-bold text-gradient" id="ticket-ref">-</span>
                            </div>
                            <div class="col-6">
                                <label class="small text-muted d-block">Slot Number</label>
                                <span class="fw-bold" id="ticket-slot">-</span>
                            </div>
                            <div class="col-6">
                                <label class="small text-muted d-block">Vehicle Number</label>
                                <span class="fw-bold" id="ticket-vehicle">-</span>
                            </div>
                            <div class="col-6">
                                <label class="small text-muted d-block">Status</label>
                                <span class="badge bg-success" id="ticket-status">Confirmed</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-custom" onclick="window.print()">Print Ticket</button>
                    <button type="button" class="btn btn-primary-custom" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & QR Code JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        let ticketModal;
        let qrGenerator;

        async function loadHistory() {
            const resp = await fetch('api/get_history.php');
            const bookings = await resp.json();
            
            const body = document.getElementById('history-body');
            body.innerHTML = '';
            
            if (bookings.length === 0) {
                body.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No bookings found.</td></tr>';
                return;
            }

            bookings.forEach(b => {
                const row = `
                    <tr class="fade-in">
                        <td>${new Date(b.created_at).toLocaleDateString()}</td>
                        <td><span class="badge bg-primary">${b.slot_number}</span></td>
                        <td>${b.vehicle_number}</td>
                        <td>${b.arrival_time}</td>
                        <td>${b.duration} hrs</td>
                        <td>₹${b.total_price}</td>
                        <td>
                            <span class="badge bg-${b.status == 'Confirmed' ? 'success' : (b.status == 'Completed' ? 'info' : 'danger')}">
                                ${b.status}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-custom py-1" onclick='showTicket(${JSON.stringify(b)})'>
                                <i class="fas fa-ticket-alt me-1"></i> View
                            </button>
                        </td>
                    </tr>
                `;
                body.insertAdjacentHTML('beforeend', row);
            });
        }

        function showTicket(booking) {
            document.getElementById('ticket-ref').innerText = booking.reference_id || 'SP-' + booking.id;
            document.getElementById('ticket-slot').innerText = booking.slot_number;
            document.getElementById('ticket-vehicle').innerText = booking.vehicle_number;
            document.getElementById('ticket-status').innerText = booking.status;

            // Clear previous QR
            document.getElementById('qrcode').innerHTML = '';
            
            // Generate New QR
            new QRCode(document.getElementById("qrcode"), {
                text: JSON.stringify({
                    id: booking.id,
                    ref: booking.reference_id,
                    slot: booking.slot_number,
                    vehicle: booking.vehicle_number
                }),
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            if (!ticketModal) {
                ticketModal = new bootstrap.Modal(document.getElementById('ticketModal'));
            }
            ticketModal.show();
        }

        loadHistory();
    </script>
</body>
</html>
