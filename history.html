<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking History | SmartPark</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-parking text-gradient me-2"></i>SmartPark
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="slots.html">Find Slots</a></li>
                    <li class="nav-item"><a class="nav-link active" href="history.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="api/auth.php?action=logout">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <h2 class="mb-5">My Booking <span class="text-gradient">History</span></h2>
        
        <div class="glass p-5">
            <div class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Slot</th>
                            <th>Vehicle</th>
                            <th>Arrival</th>
                            <th>Duration</th>
                            <th>Total</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- Loaded by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const resp = await fetch('api/get_history.php');
            const bookings = await resp.json();
            
            const body = document.getElementById('history-body');
            body.innerHTML = '';
            
            if (bookings.length === 0) {
                body.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No bookings found.</td></tr>';
                return;
            }

            bookings.forEach(b => {
                const row = `
                    <tr>
                        <td>${new Date(b.created_at).toLocaleDateString()}</td>
                        <td><span class="badge bg-primary">${b.slot_number}</span></td>
                        <td>${b.vehicle_number}</td>
                        <td>${b.arrival_time}</td>
                        <td>${b.duration} hrs</td>
                        <td>$${b.total_price}</td>
                        <td>
                            <span class="badge bg-${b.status == 'Confirmed' ? 'success' : 'danger'}">
                                ${b.status}
                            </span>
                        </td>
                    </tr>
                `;
                body.insertAdjacentHTML('beforeend', row);
            });
        }

        loadHistory();
    </script>
</body>
</html>
