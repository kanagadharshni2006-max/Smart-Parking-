<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | SmartPark</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
        }
        .form-switch-btn {
            cursor: pointer;
            color: var(--primary);
            font-weight: 600;
        }
        #register-form {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="glass auth-card fade-in">
            <div class="text-center mb-5">
                <a class="navbar-brand fs-2" href="index.html">
                    <i class="fas fa-parking text-gradient me-2"></i>SmartPark
                </a>
            </div>

            <!-- Login Form -->
            <div id="login-form">
                <h2 class="mb-4">Welcome Back</h2>
                <form id="login-form-el">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <input type="email" name="email" class="form-control-custom w-100" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" name="password" class="form-control-custom w-100" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-4">Sign In</button>
                    <p class="text-center text-muted small">
                        Don't have an account? <span class="form-switch-btn" onclick="toggleForm('register')">Sign Up</span>
                    </p>
                </form>
            </div>

            <!-- Register Form -->
            <div id="register-form">
                <h2 class="mb-4">Create Account</h2>
                <form id="register-form-el">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Full Name</label>
                        <input type="text" name="name" class="form-control-custom w-100" placeholder="John Doe" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <input type="email" name="email" class="form-control-custom w-100" placeholder="name@example.com" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" name="password" class="form-control-custom w-100" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary-custom w-100 mb-4">Register</button>
                    <p class="text-center text-muted small">
                        Already have an account? <span class="form-switch-btn" onclick="toggleForm('login')">Sign In</span>
                    </p>
                </form>
            </div>

            <div class="mt-4">
                <div class="d-flex align-items-center mb-4">
                    <hr class="flex-grow-1 opacity-10">
                    <span class="mx-3 text-muted small">OR CONTINUE WITH</span>
                    <hr class="flex-grow-1 opacity-10">
                </div>
                <div class="d-flex gap-3">
                    <button class="btn glass w-100 py-2"><i class="fab fa-google"></i></button>
                    <button class="btn glass w-100 py-2"><i class="fab fa-apple"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function toggleForm(form) {
            const login = document.getElementById('login-form');
            const register = document.getElementById('register-form');
            if (form === 'register') {
                login.style.display = 'none';
                register.style.display = 'block';
            } else {
                login.style.display = 'block';
                register.style.display = 'none';
            }
        }

        // Login Handler
        document.getElementById('login-form-el').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: e.target.email.value,
                password: e.target.password.value
            };

            const resp = await fetch('api/auth.php?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();

            if (result.success) {
                if (result.role === 'Admin') {
                    window.location.href = 'admin/dashboard.php';
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                Swal.fire('Error', result.message, 'error');
            }
        });

        // Register Handler
        document.getElementById('register-form-el').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: e.target.name.value,
                email: e.target.email.value,
                password: e.target.password.value
            };

            const resp = await fetch('api/auth.php?action=register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await resp.json();

            if (result.success) {
                Swal.fire('Success', 'Account created! Please login.', 'success').then(() => {
                    toggleForm('login');
                });
            } else {
                Swal.fire('Error', result.message, 'error');
            }
        });
    </script>
</body>
</html>
