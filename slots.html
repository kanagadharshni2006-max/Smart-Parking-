<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Parking Slots | SmartPark</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-parking text-gradient me-2"></i>SmartPark
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="slots.html">Find Slots</a></li>
                    <li class="nav-item" id="auth-link"><a class="nav-link" href="auth.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5">
        <div class="row mb-5 align-items-end">
            <div class="col-lg-6">
                <h1 class="mb-2">Find Your <span class="text-gradient">Space</span></h1>
                <p class="text-muted">Select an available parking slot to proceed with booking.</p>
            </div>
            <div class="col-lg-6">
                <div class="glass p-3 d-flex flex-wrap gap-4 justify-content-lg-end">
                    <div class="d-flex align-items-center gap-2">
                        <div style="width: 15px; height: 15px; border: 1px solid #00ff88;"></div>
                        <span class="small text-muted">Available</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div style="width: 15px; height: 15px; background: var(--primary);"></div>
                        <span class="small text-muted">Selected</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div style="width: 15px; height: 15px; border: 1px solid #ff4b4b; opacity: 0.5;"></div>
                        <span class="small text-muted">Occupied</span>
                    </div>
                    <div class="d-flex align-items-center gap-2">
                        <div style="width: 15px; height: 15px; border: 1px solid #ffaa00;"></div>
                        <span class="small text-muted">Reserved</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Filters -->
            <div class="col-lg-3">
                <div class="glass p-4 sticky-top" style="top: 100px;">
                    <h4 class="mb-4">Filters</h4>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Floor Level</label>
                        <div class="d-flex flex-column gap-2" id="floor-selector">
                            <button class="floor-btn active" onclick="setFloor('B1')">Floor 1 (B1)</button>
                            <button class="floor-btn" onclick="setFloor('B2')">Floor 2 (B2)</button>
                            <button class="floor-btn" onclick="setFloor('B3')">Floor 3 (B3)</button>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Vehicle Type</label>
                        <div class="d-flex gap-2">
                            <button class="btn glass flex-grow-1 active" id="v-car" onclick="setVehicleType('Car')"><i class="fas fa-car"></i></button>
                            <button class="btn glass flex-grow-1" id="v-bike" onclick="setVehicleType('Motorcycle')"><i class="fas fa-motorcycle"></i></button>
                        </div>
                    </div>
                    <div id="selected-slot-info" class="mb-4 d-none">
                        <div class="p-3 glass border-primary">
                            <p class="small text-muted mb-1">Selected Slot</p>
                            <h5 class="mb-0 text-gradient" id="display-slot-num">-</h5>
                            <hr class="my-2 opacity-10">
                            <p class="small text-muted mb-0">Rate: <span id="display-price">₹0</span>/hr</p>
                        </div>
                    </div>
                    <a href="booking.html" class="btn btn-primary-custom w-100 d-none" id="proceed-btn">Proceed to Booking</a>
                </div>
            </div>

            <!-- Slots Grid -->
            <div class="col-lg-9">
                <div class="glass">
                    <div class="p-4 border-bottom border-secondary opacity-50">
                        <h5 class="mb-0">Main Parking Area - B1</h5>
                    </div>
                    <div class="slot-grid" id="slot-container">
                        <!-- Slots will be generated by JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const slotContainer = document.getElementById('slot-container');
        const proceedBtn = document.getElementById('proceed-btn');
        const slotInfo = document.getElementById('selected-slot-info');
        let selectedSlotId = null;
        let currentFloor = 'B1';
        let currentVehicleType = 'Car';
        let allSlots = [];

        function setFloor(floor) {
            currentFloor = floor;
            document.querySelectorAll('.floor-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(floor));
            });
            renderSlots();
        }

        function setVehicleType(type) {
            currentVehicleType = type;
            document.getElementById('v-car').classList.toggle('active', type === 'Car');
            document.getElementById('v-bike').classList.toggle('active', type === 'Motorcycle');
            renderSlots();
        }

        async function loadSlots() {
            try {
                const response = await fetch('api/get_slots.php');
                allSlots = await response.json();
                renderSlots();
            } catch (error) {
                console.error('Error loading slots:', error);
            }
        }

        function renderSlots() {
            slotContainer.innerHTML = '';
            document.querySelector('h5.mb-0').innerText = `Main Parking Area - ${currentFloor}`;
            
            const filteredSlots = allSlots.filter(s => s.floor === currentFloor && s.vehicle_type === currentVehicleType);
            
            if (filteredSlots.length === 0) {
                slotContainer.innerHTML = '<div class="p-5 text-center text-muted w-100">No slots available for this criteria.</div>';
                return;
            }

            filteredSlots.forEach((slot, index) => {
                const slotDiv = document.createElement('div');
                const statusClass = slot.status.toLowerCase();
                const typeClass = slot.vehicle_type.toLowerCase();
                
                slotDiv.className = `glass slot ${statusClass} ${typeClass} fade-in`;
                slotDiv.style.animationDelay = `${index * 0.02}s`;
                slotDiv.innerHTML = `
                    <i class="fas fa-${typeClass === 'car' ? 'car' : 'motorcycle'}"></i>
                    <span class="small fw-bold">${slot.slot_number}</span>
                    <span class="price-tag">₹${slot.price_per_hour}/hr</span>
                `;

                if (slot.status === 'Available') {
                    slotDiv.onclick = () => {
                        document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
                        slotDiv.classList.add('selected');
                        selectedSlotId = slot.id;
                        
                        document.getElementById('display-slot-num').innerText = slot.slot_number;
                        document.getElementById('display-price').innerText = `₹${slot.price_per_hour}`;
                        
                        slotInfo.classList.remove('d-none');
                        proceedBtn.classList.remove('d-none');
                        proceedBtn.href = `booking.html?slot_id=${slot.id}&slot_num=${slot.slot_number}&price=${slot.price_per_hour}`;
                    };
                }
                slotContainer.appendChild(slotDiv);
            });
        }

        async function checkAuth() {
            const resp = await fetch('api/auth.php?action=check');
            const user = await resp.json();
            
            if (user.logged_in) {
                const authLink = document.getElementById('auth-link');
                authLink.innerHTML = `<a class="nav-link" href="history.html">My Bookings</a>`;
                
                const nav = document.getElementById('nav-links');
                nav.insertAdjacentHTML('beforeend', `<li class="nav-item"><a class="nav-link text-danger" href="api/auth.php?action=logout">Logout</a></li>`);
                
                if (user.role === 'Admin') {
                    nav.insertAdjacentHTML('afterbegin', `<li class="nav-item"><a class="nav-link text-warning" href="admin/dashboard.php">Admin Panel</a></li>`);
                }
            }
        }
        checkAuth();
        loadSlots();
    </script>
</body>
</html>
